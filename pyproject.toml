[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creditloss"
version = "1.0.0"
description = "Scenario-conditional credit-loss projection and IFRS 9 expected credit loss, with an interactive app"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xiaokai Wu" }]
keywords = ["IFRS 9", "expected credit loss", "stress testing", "credit risk", "PD model", "LGD", "scenario analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "streamlit>=1.50",
  "altair>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
creditloss = "creditloss.cli:main"

[tool.setuptools.packages.find]
include = ["creditloss*"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
