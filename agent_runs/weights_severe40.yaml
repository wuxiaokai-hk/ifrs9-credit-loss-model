paths:
  macro_history: data/eqb_public/macro_history.csv
  macro_scenarios: data/eqb_public/macro_scenarios.csv
  portfolio_history: data/eqb_public/portfolio_history.csv
  portfolio_snapshot: data/eqb_public/portfolio_snapshot.csv
  literature_table: config/literature_public.csv
  outputs: agent_runs/weights_severe40
  cache: .cache/eqb_public
columns:
  date: date
  segment: segment
  balance: balance
  undrawn: undrawn
  default_rate: default_rate
  nco_rate: nco_rate
  loss_rate_on_default: lgd_realized
  insured_share: insured_share
collateral_index: HPI_CA
segments:
  mortgage_uninsured:
    contractual_term_years: 2.5
    workout_quarters: 6
    reported_acl: 63200000
    label: Single-family uninsured + decumulation
    lgd_model: structural_ltv
    ead_model: amortizing
    sign_priors: household
    candidates:
    - LBR_CA
    - HPI_CA
    - R3M
    - R10Y
    - GDPR_CA
    proxy: CBA Ontario mortgages 90+ days in arrears (% of count)
    jumpoff_pd: 1.7
    sale_cost: 0.07
    forced_sale_discount: 0.1
    workout_cost: 0.03
    contract_rate: 0.055
    cure_rate: 0.4
  mortgage_insured:
    contractual_term_years: 3.0
    workout_quarters: 6
    reported_acl: 1200000
    label: Single-family and multi-unit insured
    lgd_model: insured
    ead_model: amortizing
    sign_priors: household
    candidates:
    - LBR_CA
    - HPI_CA
    - R3M
    - R10Y
    - GDPR_CA
    proxy: CBA Ontario mortgages 90+ days in arrears (% of count)
    jumpoff_pd: 1.3
    insurer_coverage: 1.0
    residual_cost: 0.01
    contract_rate: 0.045
    cure_rate: 0.4
  credit_cards:
    workout_quarters: 2
    reported_acl: 239838000
    label: Credit cards (PC Financial)
    lgd_model: fixed
    ead_model: revolving
    sign_priors: us
    candidates:
    - LBR_US
    proxy: US commercial banks credit-card charge-off rate (FRED CORCCACBS)
    jumpoff_pd: null
    target_acl: 239838000
    lifetime_years: 3
    fixed_lgd: 0.85
    ccf: 0.25
    cure_rate: 0.05
  commercial:
    contractual_term_years: 3.0
    workout_quarters: 6
    reported_acl: 95600000
    label: Commercial loans + equipment financing
    lgd_model: frye_jacobs
    ead_model: amortizing
    sign_priors: us
    candidates:
    - LBR_US
    proxy: US commercial banks business-loan charge-off rate (FRED CORBLACBS)
    jumpoff_pd: 3.4
    fixed_lgd: 0.15
    asset_corr: 0.15
    contract_rate: 0.07
    cure_rate: 0.2
pd_model:
  transform: logit
  include_ar: true
  max_drivers: 3
  lags:
  - 0
  - 1
  - 2
  - 3
  - 4
  variable_transforms:
  - level
  - d4
  - yoy
  screen_top_n: 40
  cluster_corr: 0.85
  primary_ratio: 0.8
  require_sign_priors: true
  max_vif: 5
  min_obs: 40
  force_categories: []
  bma:
    enabled: true
    top_k: 50
  stress_weight: 0.0
  literature_specs:
    household:
      BoC SAP 2026-12 style:
        drivers:
        - LBR_CA|level|L2
        - HPI_CA|yoy|L4
        - R10Y|level|L4
        ar: false
      BoC TDSA-style ARDL:
        drivers:
        - LBR_CA|d4|L0
        - HPI_CA|yoy|L0
        ar: true
      ECB/EBA core satellite:
        drivers:
        - LBR_CA|level|L1
        - HPI_CA|yoy|L2
        - R10Y|level|L2
        ar: true
    us:
      CLASS-style (UR level):
        drivers:
        - LBR_US|level|L1
        ar: true
      CLASS-style (UR change):
        drivers:
        - LBR_US|d4|L0
        ar: true
nco_model:
  enabled: false
ifrs9:
  sicr_multiple: 3.0
  lifetime_years: 5
  no_cure_stage3: true
  allowance_cover_quarters: 4
  scenario_weights:
    baseline: 0.2
    upside: 0.1
    downside: 0.3
    severe: 0.4
  reasonable_supportable_quarters: 12
  reversion_quarters: 8
  stage2_pd_multiple: 3.0
  stage2_cure_q: 0.1
  workout_quarters: 4
  discount: true
ead:
  balance_sheet: static
horizon_quarters: 13
jump_off: '2026-06-30'
scenarios:
  baseline: baseline
  upside: upside
  downside: downside
  severe: severe
oos:
  first_origin: '2004-12-31'
  step_quarters: 4
  horizons:
  - 4
  - 8
  - 12
  stress_windows:
  - - '2008-09-30'
    - '2010-06-30'
  - - '2023-06-30'
    - '2026-06-30'
  selection_tolerance: 0.05
  champion_min_capture: 80
  champion_max_capture: 200
random_seed: 20261104
