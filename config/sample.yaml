# ---------------------------------------------------------------------------
# Sample configuration: a simulated Ontario credit-union book with known drivers.
# Every file, column and model setting is declared here, never in code.
# Run: `creditloss run --config config/sample.yaml --backtest`.
# ---------------------------------------------------------------------------

paths:
  macro_history: data/sample/macro_history.csv        # quarterly, one column per Moody's mnemonic
  macro_scenarios: data/sample/macro_scenarios.csv    # long format: scenario, date, <mnemonics>
  portfolio_history: data/sample/portfolio_history.csv  # quarterly, one row per date x segment
  portfolio_snapshot: data/sample/portfolio_snapshot.csv  # jump-off book: segment x LTV bucket
  literature_table: config/literature_sample.csv
  outputs: outputs/sample
  cache: .cache/sample

columns:
  date: date
  segment: segment
  balance: balance                 # drawn balance at quarter end
  undrawn: undrawn                 # authorized but unused (HELOCs, LOCs)
  default_rate: default_rate       # new 90+ dpd / impaired flow over quarter, % of start balance (annualized)
  arrears_rate: arrears_rate       # stock of 90+ dpd, % of balances
  nco_rate: nco_rate               # net charge-offs / avg balance, annualized %
  loss_rate_on_default: lgd_realized
  insured_share: insured_share
  stage2_share: stage2_share
  allowance: allowance

# Portfolio segments and how losses are built for each.
segments:
  mortgage_uninsured:
    label: Residential mortgages, uninsured
    pd_model: satellite            # satellite | nco_only
    lgd_model: structural_ltv      # structural_ltv | frye_jacobs | fixed
    ead_model: amortizing
    sign_priors: household
    fixed_lgd: 0.15
    sale_cost: 0.08                # realtor, legal, carrying cost, % of property value
    forced_sale_discount: 0.10     # distressed-sale haircut on top of index decline
    cure_rate: 0.45                # share of 90+ defaults that cure without loss
    workout_cost: 0.02             # legal/admin cost, % of balance, paid even when fully collateralized
    contract_rate: 0.045           # for annuity amortization of existing loans
  mortgage_insured:
    label: Residential mortgages, CMHC/private insured
    pd_model: satellite
    lgd_model: insured
    ead_model: amortizing
    sign_priors: household
    insurer_coverage: 1.0          # share of shortfall the insurer pays
    residual_cost: 0.01            # lender-borne costs not reimbursed
    cure_rate: 0.45
  heloc:
    label: Home equity lines of credit
    pd_model: satellite
    lgd_model: structural_ltv
    ead_model: revolving
    sign_priors: household
    ccf: 0.45                      # share of undrawn drawn before default
    sale_cost: 0.08
    forced_sale_discount: 0.10
    cure_rate: 0.30
    lien_position: second          # recovers only after first-lien balance
    workout_cost: 0.05
    contract_rate: 0.055
  consumer:
    label: Consumer loans and lines
    pd_model: satellite
    lgd_model: fixed
    ead_model: revolving
    sign_priors: household
    fixed_lgd: 0.75
    ccf: 0.35
    cure_rate: 0.10
  commercial_re:
    label: Commercial real estate and business
    pd_model: satellite
    lgd_model: frye_jacobs
    ead_model: amortizing
    sign_priors: business
    fixed_lgd: 0.30                # long-run LGD for the Frye-Jacobs link
    contract_rate: 0.060
    asset_corr: 0.15
    cure_rate: 0.20

# ---------------------------------------------------------------------------
# PD satellite model search (the balance-forecasting search engine, adapted to a default rate).
# ---------------------------------------------------------------------------
pd_model:
  transform: logit                 # logit | log | level  (logit keeps PD in (0,1))
  include_ar: true                 # lagged dependent variable (BoC TDSA Box 1)
  max_drivers: 3
  lags: [0, 1, 2, 3, 4]            # quarters
  variable_transforms: [level, d4, yoy]   # level, 4-quarter change, y/y % change
  screen_top_n: 40                 # univariate |t| screen survivors
  cluster_corr: 0.85               # redundancy clustering threshold
  primary_ratio: 0.8               # literature "primary" driver represents its cluster if |t| >= 80% of leader
  require_sign_priors: true
  max_vif: 5
  min_obs: 60
  force_categories: []             # e.g. [Labour market] to force a labour driver
  bma:
    enabled: true                  # Gross & Poblacion (2015) model averaging
    top_k: 50
  stress_weight: 0.0               # >0 up-weights stress quarters in the fit

# Top-down cross-check, modelled on the Fed net charge-off approach,
# Hirtle et al. (2016) CLASS and BoC TDSA Approach 2.
nco_model:
  enabled: true
  include_ar: true
  forward_lead: 1                  # TDSA eq. (25) uses one-quarter-ahead macro

# ---------------------------------------------------------------------------
# Provisioning (IFRS 9) and stress-test conventions.
# ---------------------------------------------------------------------------
ifrs9:
  sicr_multiple: 3.0               # EBA: PD x3 vs origination moves to Stage 2
  lifetime_years: 5                # behavioural life for Stage 2 lifetime ECL
  no_cure_stage3: true             # EBA: Stage 3 cannot cure in the horizon
  allowance_cover_quarters: 4      # Fed: allowance covers next 4 quarters of losses
  scenario_weights:                # probability-weighted ECL
    baseline: 0.40
    upside: 0.10
    downside: 0.30
    severe: 0.20
  # --- IFRS 9 measurement (creditloss/modelling/ifrs9.py) ---
  reasonable_supportable_quarters: 12   # scenario PDs used for 3 years, then reversion to the long-run average (B5.5.13)
  reversion_quarters: 8                 # linear reversion period
  stage2_pd_multiple: 3.0               # Stage 2 loans default ~3x as often as Stage 1 (consistent with the SICR test)
  stage2_cure_q: 0.10                   # quarterly cure rate out of Stage 2 (~3-quarter probation)
  workout_quarters: 4                   # default: quarters from Stage 3 entry to resolution (write-off or cure)
  discount: true                        # discount expected shortfalls at the effective interest rate (B5.5.44)

ead:
  balance_sheet: static            # static | runoff | growth
  growth_file: data/loan_growth.csv  # used when growth: scenario, date, segment, growth (quarterly, fraction)
                                   # e.g. exported from a balance-forecasting model's scenario forecasts

horizon_quarters: 13               # Fed uses 9 quarters (13 for losses); BoE 5 years
jump_off: "2026-09-30"

scenarios:
  # Names as they appear in macro_scenarios.csv. Map Moody's S0-S4 here.
  baseline: baseline
  upside: upside
  downside: downside
  severe: severe

oos:
  first_origin: "2006-12-31"
  step_quarters: 4
  horizons: [4, 8, 12]
  stress_windows:                  # "does the model see the stress coming" test
    - ["2008-09-30", "2010-06-30"]
    - ["2020-03-31", "2021-03-31"]
  selection_tolerance: 0.05
  champion_min_capture: 80         # champion must capture >= 80% of GFC defaults out of sample

random_seed: 20261026
